name: Build and Release Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Train AI Model (if not bundled)
        shell: pwsh
        run: |
          if (-not (Test-Path "traffic_classifier.pkl")) {
            python train_model.py
          }

      - name: Build Executable with PyInstaller
        shell: pwsh
        run: |
          cd build
          pyinstaller --clean pyinstaller.spec

      - name: Install Inno Setup
        uses: choco-github-actions/setup-chocolatey@v2
        with:
          args: choco install innosetup -y

      - name: Compile Windows Installer with Inno Setup
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build\installer.iss

      - name: Package Portable ZIP Archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist\CryptoFlow-IDS\* -DestinationPath build\CryptoFlow-IDS-Portable.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build\Output\CryptoFlow-IDS-Setup.exe
            build\CryptoFlow-IDS-Portable.zip
          draft: false
          prerelease: false
          generate_release_notes: true
