name: Build and Release Windows App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Train AI Model & Calibrate Dataset
        shell: pwsh
        run: |
          python -u train_model.py

      - name: Build Executable with PyInstaller
        shell: pwsh
        run: |
          cd build
          python -m PyInstaller --clean pyinstaller.spec
          Get-ChildItem -Recurse dist

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y

      - name: Compile Windows Installer with Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "build\Output")) {
            New-Item -ItemType Directory -Path "build\Output"
          }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command iscc).Source
          }
          & $iscc build\installer.iss

      - name: Package Portable ZIP Archive
        shell: pwsh
        run: |
          Compress-Archive -Path build\dist\CryptoFlow-IDS\* -DestinationPath build\Output\CryptoFlow-IDS-Portable.zip -Force

      - name: Verify Built Release Artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Recurse build\Output

      - name: Publish GitHub Release with Installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v2.1.1"
          name: "CryptoFlow-IDS v2.1.1 — Clean Single-Window Enterprise Suite"
          body: |
            # 🛡️ CryptoFlow-IDS v2.1.1
            ### Enterprise Forensics, Threat Intelligence & Single-Window Native Desktop Suite

            ### 📥 One-Click Downloads
            - **[CryptoFlow-IDS-Setup.exe](https://github.com/Santhosh939s/CryptoFlow-IDS/releases/download/v2.1.1/CryptoFlow-IDS-Setup.exe)**: Official Windows Installer (Includes Desktop Shortcut, Start Menu Entry & Npcap Driver Verification).
            - **[CryptoFlow-IDS-Portable.zip](https://github.com/Santhosh939s/CryptoFlow-IDS/releases/download/v2.1.1/CryptoFlow-IDS-Portable.zip)**: Standalone Portable Bundle (No Installation Required — extract and double-click `CryptoFlow-IDS.exe`).

            ---

            ### 🚀 What's New in v2.1.1
            - 🖥️ **Pure Single-Window GUI**: Removed unnecessary black console/terminal windows (`console=False`). The app now launches strictly into the sleek native Cyber HUD window.
            - 🛠️ **Fixed Windows Setup Elevation (Code 740)**: Inno Setup now launches elevated executables directly via `shellexec`, eliminating `CreateProcess failed; code 740`.
            - ⚡ **Fixed Engine Multiprocessing (freeze_support)**: Clicking "START ENGINE" runs packet sniffing silently on background CPU cores without spawning duplicate terminals or windows.
            - 🔔 **In-App Auto-Update Notification Banner**: Checks GitHub Releases on startup and displays a glowing 1-click update banner inside the HUD whenever a new version is published.
            - 📁 **Automated Incident PCAP Dumping**: Reconstructs raw offending packet buffers into Wireshark-ready captures (`incidents/incident_*.pcap`).
            - 🌐 **Threat Intelligence & IP Geolocation**: Enriches attacker IPs with ASN, country, flag, and threat severity score.
            - 📑 **1-Click Executive Security Audit Reports**: Generates cryptographic SHA-256 sealed audit reports for corporate compliance and academic vivas.
            - 🛡️ **Windows Defender Firewall Mitigation**: Atomic debouncing drops attacker IPs in 69ms with automatic rule rollback on exit.
          files: |
            build/Output/CryptoFlow-IDS-Setup.exe
            build/Output/CryptoFlow-IDS-Portable.zip
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
