name: Build and Release Windows App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Train AI Model & Calibrate Dataset
        shell: pwsh
        run: |
          python -u train_model.py

      - name: Build Executable with PyInstaller
        shell: pwsh
        run: |
          cd build
          python -m PyInstaller --clean pyinstaller.spec

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y

      - name: Compile Windows Installer with Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "build\Output")) {
            New-Item -ItemType Directory -Path "build\Output"
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build\installer.iss

      - name: Package Portable ZIP Archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist\CryptoFlow-IDS\* -DestinationPath build\Output\CryptoFlow-IDS-Portable.zip -Force

      - name: Verify Built Release Artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Recurse build\Output

      - name: Publish GitHub Release with Installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v2.0.0"
          name: "CryptoFlow-IDS v2.0.0 — Enterprise Windows & Linux Release"
          body: |
            # 🛡️ CryptoFlow-IDS v2.0.0

            ### 📥 One-Click Downloads
            - **[CryptoFlow-IDS-Setup.exe](https://github.com/Santhosh939s/CryptoFlow-IDS/releases/download/v2.0.0/CryptoFlow-IDS-Setup.exe)**: Official Windows Installer (Includes Desktop Shortcut & Npcap Verification).
            - **[CryptoFlow-IDS-Portable.zip](https://github.com/Santhosh939s/CryptoFlow-IDS/releases/download/v2.0.0/CryptoFlow-IDS-Portable.zip)**: Standalone Portable Bundle (No Installation Required).

            ### ✨ Key Features
            - **Real-Time Cyber HUD**: High-tech telemetry dashboard with live Shannon Entropy charts, packet rate, and protocol breakdown.
            - **Multiprocessing Core**: Decoupled from Python GIL for ultra-low latency and 60 FPS UI rendering.
            - **Automated Windows Firewall Mitigation**: Instant inbound `BLOCK` rules via `netsh advfirewall` (benchmarked at 69ms flood response).
            - **UDP / QUIC Detection**: In-kernel & user-space RFC 9000 inspection for HTTP/3 exfiltration.
            - **1-Click Simulation Lab**: Built-in exfiltration generator inside the GUI.
          files: |
            build/Output/CryptoFlow-IDS-Setup.exe
            build/Output/CryptoFlow-IDS-Portable.zip
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
