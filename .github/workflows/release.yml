name: Build and Release Windows App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Train AI Model & Calibrate Dataset
        shell: pwsh
        run: |
          python -u train_model.py

      - name: Build Executable with PyInstaller
        shell: pwsh
        run: |
          cd build
          python -m PyInstaller --clean pyinstaller.spec
          Get-ChildItem -Recurse dist

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y

      - name: Compile Windows Installer with Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "build\Output")) {
            New-Item -ItemType Directory -Path "build\Output"
          }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command iscc).Source
          }
          & $iscc build\installer.iss

      - name: Package Portable ZIP Archive
        shell: pwsh
        run: |
          Compress-Archive -Path build\dist\CryptoFlow-IDS\* -DestinationPath build\Output\CryptoFlow-IDS-Portable.zip -Force

      - name: Verify Built Release Artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Recurse build\Output

      - name: Publish GitHub Release with Installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v2.1.0"
          name: "CryptoFlow-IDS v2.1.0 — Enterprise Forensics & Threat Intelligence Suite"
          body: |
            # 🛡️ CryptoFlow-IDS v2.1.0
            ### Enterprise Forensics, Threat Intelligence & Automated PCAP Dumping Suite

            ### 📥 One-Click Downloads
            - **[CryptoFlow-IDS-Setup.exe](https://github.com/Santhosh939s/CryptoFlow-IDS/releases/download/v2.1.0/CryptoFlow-IDS-Setup.exe)**: Official Windows Installer (Includes Desktop Shortcut, Start Menu Entry & Npcap Driver Verification).
            - **[CryptoFlow-IDS-Portable.zip](https://github.com/Santhosh939s/CryptoFlow-IDS/releases/download/v2.1.0/CryptoFlow-IDS-Portable.zip)**: Standalone Portable Bundle (No Installation Required — extract and double-click `CryptoFlow-IDS.exe`).

            ---

            ### 🚀 What's New in v2.1.0 (Phase 3)
            - 📁 **Automated Incident PCAP Dumping**: Automatically reconstructs raw offending packet buffers into Wireshark-ready forensic captures (`incidents/incident_*.pcap`) on threat detection with 1-click download links in the HUD.
            - 🌐 **Threat Intelligence & IP Geolocation**: Enriches attacker IP addresses with Autonomous System (ASN), country, flag, and calculated Threat Severity Scores (0–100) on live threat alert cards.
            - 📑 **1-Click Executive Security Audit Reports**: Generates cryptographic SHA-256 sealed HTML/PDF incident audit reports for corporate compliance and academic vivas.
            - 📂 **Offline PCAP Drag-and-Drop Studio**: Security analysts can drag-and-drop saved `.pcap`/`.pcapng` captures into the GUI for instant batch Shannon Entropy profiling and AI threat classification.
            - ⚡ **Full Multiprocessing Core (GIL Bypass)**: Packet sniffing runs on a dedicated CPU core to maintain a smooth 60 FPS Cyber HUD interface.
            - 🛡️ **Sub-Millisecond Windows Defender Firewall Mitigation**: Atomic debouncing drops attacker IPs in 69.59ms with automatic rule rollback on exit.
          files: |
            build/Output/CryptoFlow-IDS-Setup.exe
            build/Output/CryptoFlow-IDS-Portable.zip
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
